name: Prepare draft from existing build
run-name: Prepare draft from desktop build ${{ inputs.build_number }}

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build desktop packages number, for example 38 (without the hash sign)
        required: true
        type: string

concurrency:
  group: astrobatch-desktop-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source:
    if: github.repository == 'ChenCLian/AstroBatch'
    name: Select build and export its tested source
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.build.outputs.commit }}
      run_id: ${{ steps.build.outputs.run_id }}
      artifact_ids: ${{ steps.build.outputs.artifact_ids }}
      source_artifact: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check run-selection tooling
        run: |
          python3 -m unittest discover -v -s release-tools/tools/release -p 'test_select_release_run.py'
          python3 -m unittest discover -v -s release-tools/tools/release -p 'test_release_delivery*.py'
      - name: Select completed build and check all artifact availability
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          ASTER_BUILD_NUMBER: ${{ inputs.build_number }}
        run: python3 release-tools/tools/release/select_release_run.py --build-number "$ASTER_BUILD_NUMBER" --output "$RUNNER_TEMP/selected-build.json"
      # The program packages belong to this exact historical commit, not to the
      # newer commit that added this recovery workflow.
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.build.outputs.commit }}
          path: tested-source
          persist-credentials: false
      - name: Export the source and release notes for this build
        run: |
          if [[ ! -f tested-source/AstroBatch.pro ]]; then
            echo "::error::Run Build desktop packages in ChenCLian/AstroBatch and select its build number. The selected build predates the AstroBatch packages."
            exit 1
          fi
          python3 tested-source/tools/release/update_version.py --check
          python3 tested-source/tools/release/package_source.py --output "$RUNNER_TEMP/source-export"
          version="$(tr -d '\r\n' < tested-source/VERSION)"
          mkdir "$RUNNER_TEMP/tested-release-inputs"
          cp tested-source/{VERSION,RELEASE_NOTES.md} "$RUNNER_TEMP/selected-build.json" "$RUNNER_TEMP/tested-release-inputs/"
          cd "$RUNNER_TEMP/source-export"
          zip -qr "$RUNNER_TEMP/tested-release-inputs/source.zip" "AstroBatch-source-export-$version"
      - uses: actions/upload-artifact@v6
        id: bundle
        with:
          name: tested-release-inputs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tested-release-inputs/
          compression-level: 0
          if-no-files-found: error

  draft:
    name: Reuse verified build artifacts and prepare draft
    needs: source
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: release-tools
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.source.outputs.source_artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/tested-release-inputs
      - uses: actions/download-artifact@v5
        with:
          artifact-ids: ${{ needs.source.outputs.artifact_ids }}
          merge-multiple: false
          path: ${{ runner.temp }}/astrobatch-artifacts
          github-token: ${{ github.token }}
          run-id: ${{ needs.source.outputs.run_id }}
      - name: Assemble packages with their tested source and release notes
        run: |
          inputs_dir="$RUNNER_TEMP/tested-release-inputs"
          cp "$inputs_dir/selected-build.json" "$RUNNER_TEMP/selected-build.json"
          version="$(tr -d '\r\n' < "$inputs_dir/VERSION")"
          python3 release-tools/tools/release/release_delivery.py prepare --version "$version" --source-root "$inputs_dir" --artifacts "$RUNNER_TEMP/astrobatch-artifacts" --directory "$RUNNER_TEMP/release-ready"
          mv "$inputs_dir/source.zip" "$RUNNER_TEMP/release-ready/AstroBatch-$version-source.zip"
          echo "ASTER_VERSION=$version" >> "$GITHUB_ENV"
      - name: Create or update draft for the tested commit
        env:
          GH_TOKEN: ${{ (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && secrets.ASTROBATCH_RELEASE_TOKEN) || github.token }}
          ASTER_TESTED_COMMIT: ${{ needs.source.outputs.commit }}
        run: python3 release-tools/tools/release/release_delivery.py draft --version "$ASTER_VERSION" --directory "$RUNNER_TEMP/release-ready" --commit "$ASTER_TESTED_COMMIT"
      - name: Record mirror allow-list
        run: python3 release-tools/tools/release/release_delivery.py mirror-plan --version "$ASTER_VERSION" --directory "$RUNNER_TEMP/release-ready"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-preparation
          path: |
            ${{ runner.temp }}/selected-build.json
            ${{ runner.temp }}/release-ready/mirror-plan.json
            ${{ runner.temp }}/release-ready/RELEASE_GITHUB.md
            ${{ runner.temp }}/release-ready/RELEASE_GITEE.md
          if-no-files-found: ignore
          overwrite: true
